name: AutoShutter
options:
  bundleIdPrefix: com.autoshutter
  deploymentTarget:
    iOS: "18.1"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  AutoShutter:
    type: application
    platform: iOS
    deploymentTarget: "18.1"
    sources:
      - path: AutoShutter
    resources:
      - path: AutoShutter/Assets.xcassets
    info:
      path: AutoShutter/Info.plist
      properties:
        CFBundleDisplayName: "拍刻"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          {}
        NSCameraUsageDescription: "AutoShutter 需要使用相机来预览画面并自动拍照。请允许访问以使用自动定时拍摄功能。"
        NSPhotoLibraryAddUsageDescription: "AutoShutter 需要将拍摄的照片保存到您的相册中。请允许访问以便照片自动保存。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autoshutter.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
